# heain-job-client: submits orchestration jobs (heain-job-submit).
manifest_version: 1
app:
  id: heain-job-client
  version: 1.0.0
  group: domain
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - {name: client.submit, version: 1, formal: false, execution: job, ai: {used: false}}
uses:
  - {app: heain-job, capabilities: [job.orchestrate]}
